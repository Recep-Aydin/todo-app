<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapılacaklar Listesi</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- Konfeti katmanı -->
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <!-- ARKA PLAN SÜSLEMELERİ: geleceği hatırlatan kupalar, başarı simgeleri, Teknofest araması -->
  <div class="bg-decor" aria-hidden="true">
    <span class="bg-icon" style="--x:4%;  --y:14%; --s:56px; --d:0s">🏆</span>
    <span class="bg-icon" style="--x:90%; --y:10%; --s:44px; --d:1.2s">🥇</span>
    <span class="bg-icon" style="--x:12%; --y:70%; --s:38px; --d:2s">⭐</span>
    <span class="bg-icon" style="--x:86%; --y:64%; --s:50px; --d:.6s">🚀</span>
    <span class="bg-icon" style="--x:7%;  --y:44%; --s:40px; --d:1.8s">⚙️</span>
    <span class="bg-icon" style="--x:93%; --y:38%; --s:42px; --d:2.6s">🏅</span>
    <span class="bg-icon" style="--x:16%; --y:90%; --s:36px; --d:1s">🎯</span>
    <span class="bg-icon" style="--x:82%; --y:88%; --s:38px; --d:2.2s">💡</span>
    <span class="bg-icon" style="--x:48%; --y:5%;  --s:30px; --d:1.5s">🌟</span>
    <span class="bg-icon" style="--x:50%; --y:93%; --s:40px; --d:.9s">🛰️</span>
    <span class="bg-icon" style="--x:96%; --y:80%; --s:34px; --d:1.7s">🏆</span>
    <span class="bg-icon" style="--x:3%;  --y:88%; --s:30px; --d:2.4s">⭐</span>

    <!-- Teknofest temalı stilize arma (orijinal logo değil, homage) -->
    <div class="bg-emblem" title="Geleceği yazanlar">
      <div class="emblem">
        <span class="emblem__star">★</span>
        <span class="emblem__title">TEKNOFEST</span>
        <span class="emblem__sub">GELECEĞE</span>
      </div>
    </div>
  </div>

  <!-- GİRİŞ / KAYIT EKRANI -->
  <div class="auth" id="authScreen" hidden>
    <div class="auth__card">
      <h1 class="auth__title">Yapılacaklar</h1>
      <p class="auth__subtitle" id="authSubtitle">Hesabına giriş yap</p>

      <form class="auth__form" id="authForm">
        <input type="email" id="authEmail" class="auth__input"
               placeholder="E-posta" autocomplete="email" required>
        <input type="password" id="authPassword" class="auth__input"
               placeholder="Şifre (en az 6 karakter)" autocomplete="current-password"
               minlength="6" required>

        <p class="auth__error" id="authError" hidden></p>

        <button type="submit" class="auth__btn" id="authSubmit">Giriş Yap</button>
      </form>

      <p class="auth__switch">
        <span id="authSwitchText">Hesabın yok mu?</span>
        <button type="button" class="link-btn link-btn--accent" id="authToggle">Kaydol</button>
      </p>
    </div>
  </div>

  <!-- UYGULAMA + YAN PANEL -->
  <div class="layout" id="appScreen" hidden>
    <!-- Ana todo kartı -->
    <div class="app">
      <header class="app__header">
        <div class="app__header-row">
          <div>
            <h1>Yapılacaklar</h1>
            <p class="app__date" id="date"></p>
          </div>
          <div class="app__user">
            <div class="app__user-top">
              <button class="icon-btn" id="themeToggle" title="Tema değiştir" aria-label="Tema değiştir">🌙</button>
              <button class="link-btn" id="logoutBtn">Çıkış</button>
            </div>
            <span class="app__email" id="userEmail"></span>
          </div>
        </div>
      </header>

      <form class="todo-form" id="todoForm">
        <input type="text" id="todoInput" class="todo-form__input"
               placeholder="Yeni bir görev ekle..." autocomplete="off" maxlength="200">
        <select id="todoPriority" class="todo-form__priority" title="Öncelik">
          <option value="high">🔴 Yüksek</option>
          <option value="medium" selected>🟡 Orta</option>
          <option value="low">🟢 Düşük</option>
        </select>
        <input type="date" id="todoDue" class="todo-form__date" title="Son tarih (isteğe bağlı)">
        <button type="submit" class="todo-form__btn" aria-label="Ekle">+</button>
      </form>

      <div class="toolbar">
        <input type="search" id="searchInput" class="toolbar__search"
               placeholder="🔍 Görevlerde ara..." autocomplete="off">
      </div>

      <!-- İlerleme çubuğu -->
      <div class="progress" id="progress" hidden>
        <div class="progress__head">
          <span class="progress__label">Günlük ilerleme</span>
          <span class="progress__pct" id="progressPct">%0</span>
        </div>
        <div class="progress__track">
          <div class="progress__bar" id="progressBar"></div>
        </div>
      </div>

      <div class="filters" id="filters">
        <button class="filters__btn is-active" data-filter="all">Tümü</button>
        <button class="filters__btn" data-filter="active">Aktif</button>
        <button class="filters__btn" data-filter="completed">Tamamlanan</button>
      </div>

      <ul class="todo-list" id="todoList"></ul>

      <div class="empty" id="empty" hidden>
        <p>Henüz görev yok 🎉</p>
      </div>

      <footer class="app__footer" id="footer" hidden>
        <span id="counter">0 görev kaldı</span>
        <button class="link-btn" id="clearCompleted">Tamamlananları temizle</button>
      </footer>
    </div>

    <!-- Mühendis köşesi -->
    <aside class="panel">
      <h2 class="panel__brand">🛠️ Mühendis Köşesi</h2>

      <section class="panel__section">
        <h3 class="panel__title">Günün Terimi</h3>
        <div class="term">
          <p class="term__name" id="termName">—</p>
          <p class="term__def" id="termDef"></p>
        </div>
      </section>

      <section class="panel__section">
        <div class="panel__head">
          <h3 class="panel__title">Bugünün Mini Görevleri</h3>
          <button class="icon-btn" id="suggestRefresh" title="Önerileri yenile" aria-label="Yenile">🔄</button>
        </div>
        <ul class="suggestions" id="suggestions"></ul>
        <p class="panel__hint">Eklemek için bir öneriye tıkla ➕</p>
      </section>
    </aside>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
