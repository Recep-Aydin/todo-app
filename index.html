<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapılacaklar Listesi</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <!-- GİRİŞ / KAYIT EKRANI -->
  <div class="auth" id="authScreen" hidden>
    <div class="auth__card">
      <h1 class="auth__title">Yapılacaklar</h1>
      <p class="auth__subtitle" id="authSubtitle">Hesabına giriş yap</p>

      <form class="auth__form" id="authForm">
        <input type="email" id="authEmail" class="auth__input"
               placeholder="E-posta" autocomplete="email" required>
        <input type="password" id="authPassword" class="auth__input"
               placeholder="Şifre (en az 6 karakter)" autocomplete="current-password"
               minlength="6" required>

        <p class="auth__error" id="authError" hidden></p>

        <button type="submit" class="auth__btn" id="authSubmit">Giriş Yap</button>
      </form>

      <p class="auth__switch">
        <span id="authSwitchText">Hesabın yok mu?</span>
        <button type="button" class="link-btn link-btn--accent" id="authToggle">Kaydol</button>
      </p>
    </div>
  </div>

  <!-- UYGULAMA -->
  <div class="app" id="appScreen" hidden>
    <header class="app__header">
      <div class="app__header-row">
        <div>
          <h1>Yapılacaklar</h1>
          <p class="app__date" id="date"></p>
        </div>
        <div class="app__user">
          <span class="app__email" id="userEmail"></span>
          <button class="link-btn" id="logoutBtn">Çıkış</button>
        </div>
      </div>
    </header>

    <form class="todo-form" id="todoForm">
      <input type="text" id="todoInput" class="todo-form__input"
             placeholder="Yeni bir görev ekle..." autocomplete="off" maxlength="200">
      <button type="submit" class="todo-form__btn" aria-label="Ekle">+</button>
    </form>

    <div class="filters" id="filters">
      <button class="filters__btn is-active" data-filter="all">Tümü</button>
      <button class="filters__btn" data-filter="active">Aktif</button>
      <button class="filters__btn" data-filter="completed">Tamamlanan</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <div class="empty" id="empty" hidden>
      <p>Henüz görev yok 🎉</p>
    </div>

    <footer class="app__footer" id="footer" hidden>
      <span id="counter">0 görev kaldı</span>
      <button class="link-btn" id="clearCompleted">Tamamlananları temizle</button>
    </footer>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
